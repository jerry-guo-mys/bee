[package]
name = "bee"
version = "0.1.0"
edition = "2021"
description = "Rust 个人智能体系统 - 高性能、安全且具备长期记忆"
authors = ["Bee Team"]
license = "MIT"

# 默认运行主程序 TUI（cargo run 即启动 bee）
default-run = "bee"

[[bin]]
name = "bee"
path = "src/main.rs"

[[bin]]
name = "bee-whatsapp"
path = "src/bin/whatsapp.rs"

[[bin]]
name = "bee-web"
path = "src/bin/web.rs"
required-features = ["web"]

[[bin]]
name = "bee-lark"
path = "src/bin/lark.rs"
required-features = ["lark"]

[[bin]]
name = "bee-evolution"
path = "src/bin/evolution_test.rs"

[[bin]]
name = "bee-gateway"
path = "src/bin/gateway.rs"
required-features = ["gateway"]

[dependencies]
tokio = { version = "1.35", features = ["full"] }
tokio-util = "0.7"

ratatui = "0.28"
crossterm = "0.28"

async-openai = { version = "0.32", features = ["chat-completion", "embedding"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "0.8"

config = "0.14"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

async-trait = "0.1"
futures-util = "0.3"
uuid = { version = "1.6", features = ["v4", "serde"] }

reqwest = { version = "0.12", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
html2text = "0.16"

# SQLite 持久化（同步）
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }

# PostgreSQL 持久化（异步）+ SQLite
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "sqlite", "uuid", "chrono", "migrate"], optional = true }

# 代码搜索与分析（自主迭代）
regex = "1.10"
glob = "0.3"
walkdir = "2.4"

# 中文分词（长期记忆检索）
jieba-rs = "0.7"

# TOML 配置解析（skills 模块）
toml = "0.8"

# Web 流式响应
bytes = { version = "1.0", optional = true }

# WhatsApp 集成 (bee-whatsapp，需公网 Webhook 域名)
axum = { version = "0.7", optional = true }
tower = { version = "0.4", optional = true }

# 浏览器控制（需安装 Chrome/Chromium）
headless_chrome = { version = "1.0", optional = true }

# WebSocket（网关架构）
tokio-tungstenite = { version = "0.21", optional = true }

# Kafka
rdkafka = "0.36"

# JWT
jsonwebtoken = "9.2"
base64 = "0.22"

# 并发数据结构
dashmap = "6.0"

# 环境变量
dotenvy = "0.15"

# Markdown 与语法高亮（TUI 升级）
pulldown-cmark = "0.10"
syntect = "5.0"
two-face = "0.4"
unicode-width = "0.1"
unicode-segmentation = "1.10"
textwrap = "0.16"

[features]
default = []
whatsapp = ["dep:axum", "dep:tower"]
lark = ["dep:axum", "dep:tower"]
web = ["dep:axum", "dep:tower", "dep:bytes"]
browser = ["dep:headless_chrome"]
gateway = ["dep:axum", "dep:tower", "dep:tokio-tungstenite", "dep:sqlx"]
async-sqlite = ["dep:sqlx"]

[dev-dependencies]
tempfile = "3.0"
criterion = "0.5"
futures = "0.3"

[[bench]]
name = "memory_store_bench"
harness = false

[[bench]]
name = "session_store_bench"
harness = false
